# Hidden Tunes Render deployment blueprint (Phase 35E-5C)
#
# RETIRED (2026-07-30): public songs/catalog API moved to VPS + Cloudflare.
# Production host: https://api.hiddentunes.com
# Do not redeploy service `hidden-tunes-api` on Render.
# Keep this file for rollback history only.
#
# Recommended: two services from the same repo root (hidden-tunes-backend).
# Apply manually in Render dashboard or adapt this file when ready.

services:
  # RETIRED — songs/catalog API. Production is api.hiddentunes.com on the owned VPS.
  # Suspend/delete this Render service in the dashboard; do not recreate.
  - name: hidden-tunes-api
    type: web
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # New ffmpeg-capable worker for manual tier generation only.
  # Not part of the songs Search migration; leave alone unless separately retiring.
  - name: hidden-tunes-audio-worker
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: AUDIO_WORKER_SECRET
        sync: false
