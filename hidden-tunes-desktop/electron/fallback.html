<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; base-uri 'self'; style-src 'unsafe-inline'; img-src 'none'; script-src 'none'; object-src 'none'; frame-ancestors 'none'"
  />
  <title>Hidden Tunes Desktop</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050508;
      color: #f5f3fa;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }
    main {
      max-width: 520px;
      padding: 28px 32px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #13131d;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    p { margin: 0; line-height: 1.6; color: rgba(245, 243, 250, 0.72); }
  </style>
</head>
<body>
  <main>
    <h1>Hidden Tunes Desktop</h1>
    <p>
      The desktop shell could not load normally. Please restart the app, or reinstall
      if this continues.
    </p>
  </main>
</body>
</html>
